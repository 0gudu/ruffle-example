<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flash.gustavojp.dev - Jogos Online</title>
    <style>
        /* Reset e Fonte clássica da era Flash */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', Tahoma, sans-serif;
            background-color: #0d1117; /* Fundo escuro retro */
            background-image: radial-gradient(#2a3240 1px, transparent 1px); /* Efeito pontilhado */
            background-size: 20px 20px;
            color: #fff;
        }

        /* Topo estilo Web 2.0 / Click Jogos */
        header {
            background: linear-gradient(to bottom, #ff8a00, #e52e71);
            border-bottom: 4px solid #fff;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(229, 46, 113, 0.4);
        }
        header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            color: #fff;
            text-shadow: 4px 4px 0 #000, 6px 6px 0 rgba(0,0,0,0.3);
            margin: 0;
        }
        header p {
            font-size: 1.1rem;
            color: #ffe6f0;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            margin-top: 5px;
        }

        /* Container principal da lista de jogos */
        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(20, 25, 35, 0.95);
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .secao-titulo {
            font-size: 1.5rem;
            color: #ffb800;
            border-bottom: 2px solid #ffb800;
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 #000;
        }

        /* Grid de jogos */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Cartão do jogo (Substitui o botão simples) */
        .game-card {
            background: linear-gradient(to bottom, #2c3e50, #1a252f);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-card:hover {
            transform: scale(1.05) translateY(-5px);
            border-color: #ff8a00;
            box-shadow: 0 8px 15px rgba(255, 138, 0, 0.4);
            background: linear-gradient(to bottom, #34495e, #2c3e50);
        }

        /* Espaço para a "capa" do jogo */
        .game-thumb {
            width: 100%;
            height: 120px;
            background-color: #000;
            border: 2px inset #555;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 5px 0;
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>flash.gustavojp.dev</h1>
        <p>Seu Acervo de Jogos Clássicos em Flash</p>
    </header>

    <main>
        <h2 class="secao-titulo">Jogos em Destaque</h2>
        
        <!-- O JS vai injetar os jogos aqui dentro -->
        <div id="games-container" class="game-grid"></div>
    </main>

    <footer>
        &copy; 2026 Gustavo José Paulo - Rodando nativamente com Ruffle
    </footer>

<script>
        const container = document.getElementById('games-container');

        // Consome a lista gerada automaticamente
        fetch('jogos.json')
            .then(response => {
                if (!response.ok) throw new Error("Lista de jogos não encontrada");
                return response.json();
            })
            .then(meusJogos => {
                // Se a pasta estiver vazia
                if (meusJogos.length === 0) {
                    container.innerHTML = "<p>Nenhum jogo encontrado na pasta.</p>";
                    return;
                }

                // Cria os cartões dinamicamente
                meusJogos.forEach(jogo => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.onclick = () => {
                        window.location.href = `game.html?jogo=${encodeURIComponent(jogo.arquivo)}`;
                    };
                    
                    const thumb = document.createElement('div');
                    thumb.className = 'game-thumb';
                    thumb.innerText = jogo.icone || "🎮";

                    const titulo = document.createElement('div');
                    titulo.className = 'game-title';
                    titulo.innerText = jogo.nome;

                    card.appendChild(thumb);
                    card.appendChild(titulo);
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error("Erro ao carregar jogos:", error);
                container.innerHTML = "<p>Erro ao carregar a lista de jogos. Verifique o jogos.json.</p>";
            });
    </script>
</body>
</html>
